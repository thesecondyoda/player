<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07050d"><meta name="robots" content="noindex"><title>مركز التحكم — كيرين</title><link rel="icon" href="assets/kirin-mark.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Reem+Kufi:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/kirin.css"><link rel="stylesheet" href="css/admin.css"></head>
<body class="admin"><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">K</span><span class="brand-name">KIRIN</span></a><nav class="top-actions"><a class="nav-link" href="index.html">الموقع</a><button class="nav-link" id="logout" type="button" hidden>خروج</button></nav></header>
<main class="wrap">
<section id="login" class="panel narrow" hidden><h1>مركز التحكم</h1><p class="muted">دخول المسؤول فقط.</p><form id="loginForm"><label>البريد<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit">دخول</button><p id="loginMsg" class="muted" role="status"></p></form></section>
<div id="app" hidden>
<nav class="tabs"><button class="tab on" data-tab="over">نظرة عامة</button><button class="tab" data-tab="work">العمل</button><button class="tab" data-tab="chap">الفصول</button></nav>
<section id="tab-over" class="view"><div class="stats"><div><b id="stPub">0</b><span>فصل منشور</span></div><div><b id="stDraft">0</b><span>مسودة</span></div><div><b id="stPages">0</b><span>صفحة</span></div><div><b id="stViews">—</b><span>مشاهدة</span></div></div><div class="panel"><h2 id="ovTitle">لا يوجد عمل</h2><p class="muted" id="ovHint">ابدأ بإضافة بيانات العمل ثم ارفع الفصول.</p><div class="actions"><button class="btn primary" data-go="chap">فصل جديد</button><button class="btn" data-go="work">بيانات العمل</button></div></div></section>
<section id="tab-work" class="view" hidden><form id="workForm" class="panel grid"><h2 class="full">بيانات العمل</h2><label class="full">الاسم *<input id="wTitle" required maxlength="140"></label><label>الاسم البديل<input id="wAlt"></label><label>الرابط المختصر<input id="wSlug" placeholder="يُولَّد تلقائياً"></label><label>المؤلف<input id="wAuthor"></label><label>الرسام<input id="wArtist"></label><label>سنة الإصدار<input id="wYear" type="number" min="1900" max="2100"></label><label>النوع<select id="wType"><option value="Manga">مانغا</option><option value="Manhwa">مانهوا</option><option value="Manhua">مانها</option><option value="Comic">كوميك</option><option value="Novel">رواية</option></select></label><label>الحالة<select id="wStatus"><option value="published">منشور</option><option value="draft">مسودة</option></select></label><label class="full">التصنيفات (افصل بفاصلة)<input id="wGenres"></label><label class="full">النبذة<textarea id="wDesc" rows="5"></textarea></label><label class="full">الغلاف<input id="wCover" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label><img id="coverPrev" class="cover-prev" alt="" hidden><div class="full"><button class="btn primary" type="submit">حفظ العمل</button></div></form></section>
<section id="tab-chap" class="view" hidden><div id="orphans" class="panel warn" hidden><p id="orphanText"></p><button class="btn" id="linkOrphans" type="button">ربط الفصول بالعمل</button></div>
<form id="chapterForm" class="panel grid"><h2 class="full" id="cHead">فصل جديد</h2><label>رقم الفصل *<input id="cNumber" type="number" min="0" step="0.01" required></label><label>العنوان<input id="cTitle"></label><label>الحالة<select id="cStatus"><option value="published">منشور</option><option value="draft">مسودة</option></select></label><label class="full">صفحات الفصل<input id="cFiles" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple><small>تُرتَّب الصفحات حسب اسم الملف (1، 2، 10). عند تعديل فصل، رفع صور جديدة يستبدل صفحاته.</small></label><div class="full actions"><button class="btn primary" type="submit">حفظ الفصل</button><button class="btn" id="cReset" type="button">فصل جديد</button><span id="cMsg" class="muted mono"></span></div></form>
<div class="panel"><h2>الفصول</h2><div id="chList"></div></div></section>
</div></main><div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/shared.js"></script><script src="js/admin.js"></script></body></html>
